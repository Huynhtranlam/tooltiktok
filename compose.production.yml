services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TOOLTIKTOK_DATA_DIR: /data
      TOOLTIKTOK_SECRET_KEY: ${TOOLTIKTOK_SECRET_KEY}
      TOOLTIKTOK_COOKIE_SECURE: "1"
    volumes:
      - app_data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
